<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatFon73 :: terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">

    <meta property="og:title" content="Mateo Fonseca - Ing. Sistemas">
    <meta property="og:description" content="Desarrollador web con 1 año de experiencia en desarrollo frontend y backend.">
    <meta property="og:image" content="https://matfon73.github.io/img/preview.jpg">
    <meta property="og:url" content="https://matfon73.github.io/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mateo Fonseca - Ing. Sistemas">
    <meta name="twitter:description" content="Desarrollador web con 1 año de experiencia en desarrollo frontend y backend.">
    <meta name="twitter:image" content="https://matfon73.github.io/img/preview.jpg">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

    <div class="scanlines"></div>

    <div class="term-window">
        <div class="term-titlebar">
            <div class="titlebar-dots">
                <span class="term-dot red"></span>
                <span class="term-dot yellow"></span>
                <span class="term-dot green"></span>
            </div>
            <div class="titlebar-path">matfon73@terminal:~</div>
            <div class="titlebar-social">
                <a href="https://github.com/MatFon73" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="https://linkedin.com/in/mateo-fonseca-ab939a164" target="_blank" title="Linkedin"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="https://x.com/MatFon73" target="_blank" title="Twitter"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="https://www.instagram.com/matfon73/" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://steamcommunity.com/id/MatFon73/" target="_blank" title="Steam"><i class="fa-brands fa-steam"></i></a>
            </div>
        </div>

        <div class="term-prompt-bar">
            <span class="prompt-user">visitor</span><span class="prompt-at">@</span><span class="prompt-host">matfon73</span><span class="prompt-colon">:</span><span class="prompt-path">~</span><span class="prompt-dollar">$</span>
            <span class="prompt-input" id="prompt-input"></span>
            <span class="cursor-blink"></span>
        </div>

        <div class="term-body" id="content-area"></div>

        <div class="term-footer">
            <nav class="cmd-bar" id="cmd-bar">
                <button class="cmd-btn active" data-section="home">whoami</button>
                <button class="cmd-btn" data-section="about">about</button>
                <button class="cmd-btn" data-section="skills">skills</button>
                <button class="cmd-btn" data-section="experience">exp</button>
                <button class="cmd-btn" data-section="projects">ls</button>
                <button class="cmd-btn" data-section="contact">contact</button>
            </nav>
            <div class="term-status">
                <span class="status-indicator"></span>
                <span class="status-text">online</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
